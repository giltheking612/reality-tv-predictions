name: Agent Cron

on:
  schedule:
    - cron: '0 6 * * *'    # daily 9:00 Israel time (UTC+3) — episodes + results
    - cron: '0 6 * * 1'    # Monday 9:00 Israel time — new season detection
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'daily'
        type: choice
        options: [daily, weekly]
      show_slug:
        description: 'Show slug (leave empty for all shows)'
        required: false
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install agent dependencies
        run: cd agent && npm ci

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          cd agent

          # Determine mode: manual dispatch uses input, scheduled uses which cron fired
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            SLUG="${{ inputs.show_slug }}"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            MODE="weekly"
            SLUG=""
          else
            MODE="daily"
            SLUG=""
          fi

          if [ "$MODE" = "weekly" ]; then
            npm start weekly${SLUG:+ "$SLUG"}
          else
            npm start${SLUG:+ "$SLUG"}
          fi
